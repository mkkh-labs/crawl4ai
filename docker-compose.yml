# Shared configuration for all environments
x-base-config: &base-config
  # NO host `ports` mapping. This is a private gateway: n8n reaches it at
  # http://crawl4ai:11235 over the automation_internal network. Publishing the
  # crawler port on the host is a release blocker (AC-03).
  env_file:
    # API keys (create from .llm.env.example); optional so a fresh clone runs.
    - path: .llm.env
      required: false
  environment:
    # Auth token is REQUIRED. `:?` makes compose fail closed rather than
    # starting an unauthenticated service. Export it before `docker compose up`.
    - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN before deploying the gateway}
    # Uncomment to set default environment variables (will overwrite .llm.env)
    # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # - GROQ_API_KEY=${GROQ_API_KEY:-}
    # - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    # - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # - LLM_PROVIDER=${LLM_PROVIDER:-}  # Optional: Override default provider (e.g., "anthropic/claude-3-opus")
  # Chromium needs shared memory but the host /dev/shm bind was a shared,
  # writable mount; use a private sized tmpfs instead.
  shm_size: "1gb"
  # Least privilege: drop all capabilities, forbid privilege escalation, cap PIDs.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Read-only root filesystem; only these paths are writable (tmpfs).
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/redis:uid=999,gid=999,mode=0700
    - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
    - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
    # Keep the baked Playwright browser under ~/.cache/ms-playwright visible.
    - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
    - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
  deploy:
    resources:
      limits:
        memory: 4G
        # PID cap; expressed here (not as pids_limit) so the file stays valid
        # on Compose v5+, which rejects pids_limit alongside a limits block.
        pids: 512
      reservations:
        memory: 1G
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  user: "appuser"

services:
  crawl4ai:
    # REQUIRED: the locally built gateway image (see the Build command in
    # CLAUDE.md). There is deliberately no default: falling back to the stock
    # unclecode/crawl4ai image would silently drop this fork's baked-in
    # config.yml hardening (trusted_hosts allowlist, Redis-backed limiter).
    image: ${IMAGE:?set IMAGE to the locally built gateway image, e.g. crawl4ai-self-hosted:0.9.4}
    
    # Local build config (used with --build)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TYPE: ${INSTALL_TYPE:-default}
        ENABLE_GPU: ${ENABLE_GPU:-false}
    
    # Inherit shared config
    <<: *base-config

    # Private service DNS: n8n resolves `crawl4ai` on this network.
    networks:
      - automation_internal

# Created out-of-band (see the Deploy command in CLAUDE.md) and shared with the
# n8n stack, so it is declared external rather than owned by this file.
networks:
  automation_internal:
    external: true